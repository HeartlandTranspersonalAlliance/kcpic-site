name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changes:
    name: Detect website changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      site_changed: ${{ steps.detect.outputs.site_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test release policy (no dependencies)
        run: node --test tests/ci.test.mjs
      - name: Detect source and pending production changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/detect.mjs

  validate:
    name: Validate website
    needs: changes
    if: needs.changes.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: website-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test:ci
      - run: npm run build
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser reports, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload validated production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 7

  gate:
    name: Website release gate
    if: ${{ always() }}
    needs: [changes, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit successful detection and validation
        env:
          DETECTION: ${{ needs.changes.result }}
          SITE_CHANGED: ${{ needs.changes.outputs.site_changed }}
          VALIDATION: ${{ needs.validate.result }}
        run: |
          node --input-type=module <<'JS'
          import { gatePassed } from './scripts/ci/policy.mjs';
          const { DETECTION, SITE_CHANGED, VALIDATION } = process.env;
          console.log({ DETECTION, SITE_CHANGED, VALIDATION });
          if (!gatePassed(DETECTION, SITE_CHANGED, VALIDATION)) process.exit(1);
          JS

  deploy:
    name: Deploy validated website
    needs: [changes, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' && needs.changes.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: website-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject superseded releases inside deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ needs.gate.result }}
          SITE_CHANGED: ${{ needs.changes.outputs.site_changed }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { deploymentAllowed } from './scripts/ci/policy.mjs';
          const { GITHUB_REPOSITORY, GITHUB_EVENT_NAME, GITHUB_REF, GITHUB_SHA, GATE, SITE_CHANGED } = process.env;
          const head = execFileSync('gh', ['api', `repos/${GITHUB_REPOSITORY}/git/ref/heads/main`, '--jq', '.object.sha'], { encoding: 'utf8' }).trim();
          if (!deploymentAllowed(GITHUB_EVENT_NAME, GITHUB_REF, GATE, SITE_CHANGED, GITHUB_SHA, head)) {
            // Fail rather than mark an undeployed SHA successful in environment history.
            console.error('Release superseded or not authorized. The newest main run owns deployment.');
            process.exit(1);
          }
          JS
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
